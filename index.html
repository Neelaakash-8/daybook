<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daybook</title>
<meta name="theme-color" content="#12141c" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daybook" />
<style>
  :root {
    --bg:#12141c; --surface:#1b1f2c; --surface2:#232838; --border:#2b3145;
    --text:#eef0f7; --dim:#8a91a8; --amber:#f5a947; --amberdim:#3a2c18;
    --teal:#5fd4c1; --danger:#e8637c;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace; }
  .app { max-width:480px; margin:0 auto; padding:20px 14px 60px; }
  .header { margin-bottom:18px; }
  .title { font-size:22px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .title span { color:var(--amber); }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; line-height:1.4; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:16px; }
  .textarea { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:10px 12px; font-size:14px; resize:vertical; min-height:76px; font-family:inherit; outline:none; }
  .textarea:focus { border-color:var(--amber); }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:none; border-radius:9px; padding:9px 14px;
    font-size:13.5px; font-weight:600; cursor:pointer; background:var(--amber); color:#1a1305; }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-sm { padding:6px 10px; font-size:12.5px; }
  .error { color:var(--danger); font-size:12.5px; margin-top:8px; }

  .pending { border:1px dashed var(--teal); background:var(--surface2); border-radius:12px; padding:12px; margin-top:12px; }
  .pending.editing { margin:0 0 10px; }
  .field-label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; display:block; }
  .input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:7px 9px; font-size:13.5px; font-family:inherit; outline:none; margin-bottom:8px; }
  .input:focus { border-color:var(--teal); }
  .col2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-nav { display:flex; align-items:center; gap:4px; }
  .icon-btn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text);
    padding:5px 10px; cursor:pointer; font-size:15px; }
  .month-label { font-weight:700; font-size:14.5px; }
  .today-link { font-size:12px; color:var(--teal); cursor:pointer; background:none; border:none; padding:4px 6px; }

  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .wd { text-align:center; font-size:10.5px; color:var(--dim); padding-bottom:4px; }
  .cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; font-size:12.5px; position:relative; cursor:pointer; color:var(--text); }
  .cell.dim { color:#454b5f; cursor:default; }
  .cell.today { border:1px solid var(--amber); }
  .cell.selected { background:var(--amber); color:#1a1305; font-weight:700; }
  .dot { width:4px; height:4px; border-radius:50%; background:var(--teal); margin-top:2px; }
  .cell.selected .dot { background:#1a1305; }

  .agenda-head { display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px; }
  .agenda-title { font-size:13px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; }
  .clear { font-size:12px; color:var(--teal); background:none; border:none; cursor:pointer; }

  .date-header { font-size:12.5px; color:var(--amber); font-weight:700; margin:14px 0 6px; }
  .ticket { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; margin-bottom:10px; position:relative; animation:fadein .25s ease; cursor:pointer; }
  @keyframes fadein { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .ticket-date { width:58px; flex-shrink:0; background:var(--surface2); display:flex; flex-direction:column;
    align-items:center; justify-content:center; border-right:1.5px dashed var(--border); position:relative; }
  .ticket-date .num { font-size:19px; font-weight:800; }
  .ticket-date .mon { font-size:10px; color:var(--dim); letter-spacing:0.05em; }
  .notch { position:absolute; width:12px; height:12px; background:var(--bg); border-radius:50%; right:-6px; }
  .notch.top { top:-6px; } .notch.bot { bottom:-6px; }
  .ticket-body { flex:1; padding:10px 30px 10px 12px; min-width:0; }
  .ticket-title { font-weight:700; font-size:14px; margin-bottom:4px; word-break:break-word; }
  .ticket-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; }
  .chip.time { background:var(--amberdim); color:var(--amber); padding:2px 7px; border-radius:6px; font-weight:600; }
  .chip.loc { color:var(--dim); }
  .chip-btn { background:var(--surface2); border:1px solid var(--border); color:var(--teal); cursor:pointer; font-family:inherit; }
  .notes-toggle { font-size:11.5px; color:var(--teal); background:none; border:none; cursor:pointer; padding:0; margin-top:4px; }
  .notes { font-size:12.5px; color:var(--dim); margin-top:5px; line-height:1.4; }
  .del { position:absolute; top:8px; right:8px; background:none; border:none; color:var(--dim); cursor:pointer; padding:4px; }

  .empty { text-align:center; color:var(--dim); font-size:13px; padding:30px 10px; }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <p class="title">Day<span>book</span></p>
      <p class="sub">Paste a message. Get the date, time, and place — sorted onto your days. Everything stays on this phone.</p>
    </div>

    <div class="card">
      <textarea id="msgInput" class="textarea" placeholder='Paste the message here — e.g. "Team sync moved to Thursday 4pm, room 2B"'></textarea>
      <div class="row">
        <button class="btn" id="extractBtn" onclick="App.extract()">✨ Extract event</button>
        <button class="btn btn-ghost" onclick="App.addManual()">+ Add manually</button>
      </div>
      <div class="error" id="parseError" hidden></div>
      <div id="pendingList"></div>
    </div>

    <div class="card">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="icon-btn" onclick="App.goMonth(-1)">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button class="icon-btn" onclick="App.goMonth(1)">›</button>
        </div>
        <button class="today-link" onclick="App.goToday()">Today</button>
      </div>
      <div class="grid" id="calGrid"></div>
    </div>

    <div class="agenda-head">
      <span class="agenda-title" id="agendaTitle">Upcoming</span>
      <div class="row" style="margin:0">
        <button class="btn btn-sm" id="addForDate" onclick="App.addManual()" hidden>+ Add event</button>
        <button class="clear" id="clearSel" onclick="App.clearSelection()" hidden>Show all upcoming</button>
      </div>
    </div>
    <div id="agendaList"></div>
  </div>

<script type="module">
import * as chrono from 'https://cdn.jsdelivr.net/npm/chrono-node/+esm';

const clockSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
const pinSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const trashSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const bellSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

function pad(n){ return String(n).padStart(2,'0'); }
function toICSDate(dateStr, timeStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  if (timeStr) {
    const [hh,mm] = timeStr.split(':').map(Number);
    return `${y}${pad(m)}${pad(d)}T${pad(hh)}${pad(mm)}00`;
  }
  return `${y}${pad(m)}${pad(d)}`;
}
function icsEscape(s){ return String(s || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function generateICS(ev) {
  const now = new Date();
  const dtstamp = toICSDate(toISO(now), toHHMM(now)) + 'Z';
  const allDay = !ev.time;
  let dtstart, dtend;
  if (allDay) {
    const [y,m,d] = ev.date.split('-').map(Number);
    const next = new Date(y, m - 1, d + 1);
    dtstart = toICSDate(ev.date, null);
    dtend = toICSDate(toISO(next), null);
  } else {
    const [y,m,d] = ev.date.split('-').map(Number);
    const [hh,mm] = ev.time.split(':').map(Number);
    const end = new Date(y, m - 1, d, hh + 1, mm);
    dtstart = toICSDate(ev.date, ev.time);
    dtend = toICSDate(toISO(end), toHHMM(end));
  }
  const dayOfTrigger = allDay ? '-PT9H' : '-PT0M';
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daybook//EN','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${ev.id}@daybook`,
    `DTSTAMP:${dtstamp}`,
    allDay ? `DTSTART;VALUE=DATE:${dtstart}` : `DTSTART:${dtstart}`,
    allDay ? `DTEND;VALUE=DATE:${dtend}` : `DTEND:${dtend}`,
    `SUMMARY:${icsEscape(ev.title)}`,
    ev.location ? `LOCATION:${icsEscape(ev.location)}` : '',
    ev.notes ? `DESCRIPTION:${icsEscape(ev.notes)}` : '',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-P1D','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder',`TRIGGER:${dayOfTrigger}`,'END:VALARM',
    'END:VEVENT','END:VCALENDAR',
  ].filter(Boolean);
  return lines.join('\r\n');
}
function downloadICS(ev) {
  const content = generateICS(ev);
  const blob = new Blob([content], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(ev.title || 'event').replace(/[^\w\-]+/g, '_').slice(0, 40)}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toHHMM = (d) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

function formatTime(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function dateLabel(iso) {
  const d = new Date(iso + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}
function dayBlock(iso) {
  const d = new Date(iso + 'T00:00:00');
  return { num: d.getDate(), mon: d.toLocaleDateString('en-US', { month:'short' }).toUpperCase() };
}
function sortEvents(list) {
  return [...list].sort((a,b) => {
    const ak = a.date + 'T' + (a.time || '23:59');
    const bk = b.date + 'T' + (b.time || '23:59');
    return ak.localeCompare(bk);
  });
}
function getMonthGrid(year, month) {
  const startDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = startDay - 1; i >= 0; i--) cells.push({ day: daysInPrevMonth - i, current:false });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day:d, current:true, iso:`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}` });
  let n = 1;
  while (cells.length % 7 !== 0) cells.push({ day:n++, current:false });
  return cells;
}
function escapeAttr(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTicket(ev, editingId) {
  const db = dayBlock(ev.date);
  if (editingId === ev.id) {
    return `
      <div class="pending editing">
        <span class="field-label">Title</span>
        <input class="input" value="${escapeAttr(ev.title)}" oninput="App.updateEditingDraft('title',this.value)" placeholder="Event title">
        <div class="col2">
          <div>
            <span class="field-label">Date</span>
            <input type="date" class="input" value="${ev.date}" oninput="App.updateEditingDraft('date',this.value)">
          </div>
          <div>
            <span class="field-label">Time (optional)</span>
            <input type="time" class="input" value="${ev.time || ''}" oninput="App.updateEditingDraft('time',this.value)">
          </div>
        </div>
        <span class="field-label">Location (optional)</span>
        <input class="input" value="${escapeAttr(ev.location || '')}" oninput="App.updateEditingDraft('location',this.value)" placeholder="Where">
        <span class="field-label">Description / notes</span>
        <textarea class="input textarea" style="min-height:60px" oninput="App.updateEditingDraft('notes',this.value)" placeholder="Anything else">${escapeHtml(ev.notes || '')}</textarea>
        <div class="row" style="margin-top:2px">
          <button class="btn btn-sm" onclick="App.saveEdit()">Save changes</button>
          <button class="btn btn-ghost btn-sm" onclick="App.cancelEdit()">Cancel</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger); margin-left:auto" onclick="App.deleteEvent('${ev.id}')">Delete</button>
        </div>
      </div>`;
  }
  const timeChip = ev.time ? `<span class="chip time mono">${clockSvg}${formatTime(ev.time)}</span>` : '';
  const locChip = ev.location ? `<span class="chip loc">${pinSvg}${escapeHtml(ev.location)}</span>` : '';
  const notesPreview = ev.notes ? `<div class="notes">${escapeHtml(ev.notes)}</div>` : '';
  return `
    <div class="ticket" onclick="App.startEdit('${ev.id}')">
      <div class="ticket-date">
        <span class="num mono">${db.num}</span><span class="mon">${db.mon}</span>
        <div class="notch top"></div><div class="notch bot"></div>
      </div>
      <div class="ticket-body">
        <div class="ticket-title">${escapeHtml(ev.title)}</div>
        <div class="ticket-meta">${timeChip}${locChip}<button class="chip chip-btn" onclick="event.stopPropagation(); App.exportICS('${ev.id}')">${bellSvg}Add reminder</button></div>
        ${notesPreview}
      </div>
      <button class="del" onclick="event.stopPropagation(); App.deleteEvent('${ev.id}')">${trashSvg}</button>
    </div>`;
}

const App = {
  events: [],
  pending: [],
  viewMonth: (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })(),
  selectedDate: null,
  editingId: null,
  editingDraft: null,

  init() {
    try { this.events = JSON.parse(localStorage.getItem('daybook_events') || '[]'); }
    catch (e) { this.events = []; }
    this.renderCalendar();
    this.renderAgenda();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  },

  persist() { localStorage.setItem('daybook_events', JSON.stringify(this.events)); },

  extract() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    const errEl = document.getElementById('parseError');
    errEl.hidden = true;
    if (!text) return;
    let results = [];
    try { results = chrono.parse(text, new Date(), { forwardDate: true }); } catch (e) { console.error(e); }
    if (!results.length) {
      errEl.textContent = "Couldn't find a date or time in that message. Try adding one, or add the event by hand.";
      errEl.hidden = false;
      return;
    }
    results.forEach(r => {
      const d = r.start.date();
      const date = toISO(d);
      const time = r.start.isCertain('hour') ? toHHMM(d) : null;
      let title = (text.slice(0, r.index) + ' ' + text.slice(r.index + r.text.length)).replace(/\s+/g, ' ').trim();
      title = title.replace(/^[\-:,.\s]+|[\-:,.\s]+$/g, '');
      if (title.length > 70) title = title.slice(0, 70).trim() + '…';
      if (!title) title = 'Event';
      let location = null;
      const locMatch = text.match(/\bat\s+([A-Z][\w'&-]*(?:\s+[A-Z][\w'&-]*){0,3})/);
      if (locMatch && !r.text.includes(locMatch[1])) location = locMatch[1];
      this.pending.push({ id: uid(), title, date, time, location, notes: null });
    });
    this.renderPending();
    input.value = '';
  },

  addManual(dateOverride) {
    const date = dateOverride || this.selectedDate || todayISO();
    this.pending.push({ id: uid(), title: '', date, time: null, location: null, notes: null });
    this.renderPending();
    document.getElementById('pendingList').scrollIntoView({ behavior: 'smooth', block: 'end' });
  },

  updatePending(id, field, value) {
    const ev = this.pending.find(p => p.id === id);
    if (ev) ev[field] = value || null;
  },

  discardPending(id) {
    this.pending = this.pending.filter(p => p.id !== id);
    this.renderPending();
  },

  confirmPending(id) {
    const ev = this.pending.find(p => p.id === id);
    if (!ev || !ev.date) return;
    const clean = { ...ev, title: (ev.title || '').trim() || 'Untitled event' };
    this.events = sortEvents([...this.events, clean]);
    this.persist();
    this.pending = this.pending.filter(p => p.id !== id);
    this.renderPending();
    this.renderCalendar();
    this.renderAgenda();
  },

  deleteEvent(id) {
    this.events = this.events.filter(e => e.id !== id);
    if (this.editingId === id) this.editingId = null;
    this.persist();
    this.renderCalendar();
    this.renderAgenda();
  },

  selectDate(iso) {
    this.selectedDate = this.selectedDate === iso ? null : iso;
    this.renderCalendar();
    this.renderAgenda();
  },

  clearSelection() {
    this.selectedDate = null;
    this.renderCalendar();
    this.renderAgenda();
  },

  goMonth(delta) {
    let m = this.viewMonth.m + delta, y = this.viewMonth.y;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    this.viewMonth = { y, m };
    this.renderCalendar();
  },

  goToday() {
    const d = new Date();
    this.viewMonth = { y: d.getFullYear(), m: d.getMonth() };
    this.selectedDate = null;
    this.renderCalendar();
    this.renderAgenda();
  },

  exportICS(id) {
    const ev = this.events.find(e => e.id === id);
    if (ev) downloadICS(ev);
  },

  startEdit(id) {
    if (this.editingId === id) return;
    this.editingId = id;
    this.renderAgenda();
  },

  cancelEdit() {
    this.editingId = null;
    this.renderAgenda();
  },

  updateEditingDraft(field, value) {
    const ev = this.events.find(e => e.id === this.editingId);
    if (ev) ev[field] = value || null;
  },

  saveEdit() {
    const ev = this.events.find(e => e.id === this.editingId);
    if (!ev || !ev.date) return;
    ev.title = (ev.title || '').trim() || 'Untitled event';
    this.events = sortEvents(this.events);
    this.persist();
    this.editingId = null;
    this.renderCalendar();
    this.renderAgenda();
  },

  renderPending() {
    const el = document.getElementById('pendingList');
    el.innerHTML = this.pending.map(ev => `
      <div class="pending">
        <span class="field-label">Title</span>
        <input class="input" value="${escapeAttr(ev.title)}" oninput="App.updatePending('${ev.id}','title',this.value)" placeholder="Event title">
        <div class="col2">
          <div>
            <span class="field-label">Date</span>
            <input type="date" class="input" value="${ev.date}" oninput="App.updatePending('${ev.id}','date',this.value)">
          </div>
          <div>
            <span class="field-label">Time (optional)</span>
            <input type="time" class="input" value="${ev.time || ''}" oninput="App.updatePending('${ev.id}','time',this.value)">
          </div>
        </div>
        <span class="field-label">Location (optional)</span>
        <input class="input" value="${escapeAttr(ev.location || '')}" oninput="App.updatePending('${ev.id}','location',this.value)" placeholder="Where">
        <span class="field-label">Notes (optional)</span>
        <input class="input" value="${escapeAttr(ev.notes || '')}" oninput="App.updatePending('${ev.id}','notes',this.value)" placeholder="Anything else">
        <div class="row" style="margin-top:2px">
          <button class="btn btn-sm" onclick="App.confirmPending('${ev.id}')">Save to Daybook</button>
          <button class="btn btn-ghost btn-sm" onclick="App.discardPending('${ev.id}')">Discard</button>
        </div>
      </div>
    `).join('');
  },

  renderCalendar() {
    document.getElementById('monthLabel').textContent =
      new Date(this.viewMonth.y, this.viewMonth.m).toLocaleDateString('en-US', { month:'long', year:'numeric' });
    const cells = getMonthGrid(this.viewMonth.y, this.viewMonth.m);
    const byDate = {};
    this.events.forEach(e => { byDate[e.date] = (byDate[e.date] || 0) + 1; });
    const today = todayISO();
    const wd = ['S','M','T','W','T','F','S'].map(d => `<div class="wd">${d}</div>`).join('');
    const cellsHtml = cells.map(c => {
      if (!c.current) return `<div class="cell dim">${c.day}</div>`;
      const isToday = c.iso === today;
      const isSel = c.iso === this.selectedDate;
      const dot = byDate[c.iso] ? '<div class="dot"></div>' : '';
      return `<div class="cell ${isToday ? 'today' : ''} ${isSel ? 'selected' : ''}" onclick="App.selectDate('${c.iso}')">${c.day}${dot}</div>`;
    }).join('');
    document.getElementById('calGrid').innerHTML = wd + cellsHtml;
  },

  renderAgenda() {
    document.getElementById('agendaTitle').textContent = this.selectedDate ? dateLabel(this.selectedDate) : 'Upcoming';
    document.getElementById('clearSel').hidden = !this.selectedDate;
    document.getElementById('addForDate').hidden = !this.selectedDate;
    const today = todayISO();
    const list = sortEvents(this.events).filter(e => this.selectedDate ? e.date === this.selectedDate : e.date >= today);
    const groups = [];
    list.forEach(e => {
      if (!groups.length || groups[groups.length - 1].date !== e.date) groups.push({ date: e.date, items: [e] });
      else groups[groups.length - 1].items.push(e);
    });
    const el = document.getElementById('agendaList');
    if (!groups.length) {
      el.innerHTML = `<div class="empty">Nothing here yet. Paste a message above to get started.</div>`;
      return;
    }
    el.innerHTML = groups.map(g => `
      <div class="date-header">${dateLabel(g.date)}</div>
      ${g.items.map(ev => renderTicket(ev, this.editingId)).join('')}
    `).join('');
  },
};

window.App = App;
App.init();
</script>
</body>
</html>
